name: 블로그 장애·용량 점검
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
concurrency:
  group: blog-health-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DB 연결과 사용량 경고 기준 확인
        run: npm run monitor
        env:
          MONITOR_DATABASE_URL: ${{ secrets.MONITOR_DATABASE_URL }}
          BLOG_URL: ${{ vars.BLOG_URL }}
          DATABASE_STORAGE_LIMIT_MB: ${{ vars.DATABASE_STORAGE_LIMIT_MB }}
          STORAGE_WARNING_PERCENT: ${{ vars.STORAGE_WARNING_PERCENT || '80' }}
